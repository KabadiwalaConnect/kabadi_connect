name: Daily Price Update

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run price generator
        env:
          METALS_API_KEY: ${{ secrets.METALS_API_KEY }}
        run: python price_engine/generate_price_dataset.py

      - name: Commit and push updated dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price_engine/price_dataset.csv
          git diff --quiet --cached || git commit -m "Automated daily price update - $(date +'%Y-%m-%d')"
          git push
